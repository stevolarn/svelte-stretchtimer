<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Progress/Timer Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="20" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="850" stroke-dashoffset="260" transform="rotate(-90 256 256)" filter="url(#glow)" />

  <!-- Center Stretch Pose Silhouette -->
  <!-- Head -->
  <circle cx="256" cy="160" r="38" fill="#fde047" />

  <!-- Torso & Spine -->
  <path d="M256 208v104" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />

  <!-- Arms outstretched dynamically in reach -->
  <path d="M256 230L150 160" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M256 230l106-70" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Legs in grounded stretch -->
  <path d="M256 312L170 410" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M256 312l86 98" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Timer hand tick dot -->
  <circle cx="140" cy="140" r="16" fill="#fde047" />
  <circle cx="372" cy="140" r="16" fill="#fde047" />
</svg>
