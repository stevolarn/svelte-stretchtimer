<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Stretch &amp; Recovery" />
		<meta name="application-name" content="Stretch &amp; Recovery" />
		<meta name="theme-color" content="#f4f4ef" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Stretch &amp; Recovery — a phone-first, fully offline app for stretching, mobility and strength routines, with a pain journal and recovery tracking." />

		<!-- PWA Web App Manifest & App Icons -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
